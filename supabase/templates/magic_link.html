<div style="font-family:'Plus Jakarta Sans',-apple-system,Helvetica,Arial,sans-serif;max-width:480px;margin:0 auto;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0B1E3D;border-radius:14px 14px 0 0;">
    <tr>
      <td style="padding:16px 32px;">
        <img src="{{ .SiteURL }}/kautis-logo.png" width="28" height="28" alt="Kautis" style="width:28px;height:28px;border-radius:50%;vertical-align:middle;display:inline-block;border:0;" />
        <span style="color:#fff;font-size:18px;font-weight:700;vertical-align:middle;margin-left:10px;">Kautis</span>
      </td>
    </tr>
  </table>
  <div style="background:#FFFFFF;padding:32px;border:1px solid #E7E2D3;border-top:none;border-radius:0 0 14px 14px;color:#14213D;">
    <p style="margin:0 0 12px;font-size:18px;font-weight:700;">Sign in to Kautis</p>
    <p style="margin:0 0 16px;font-size:14px;">Click below to sign in. This link expires in one hour and can only be used once.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink&next=/today" style="display:inline-block;padding:12px 24px;background:#C9A227;color:#0B1E3D;font-weight:600;text-decoration:none;border-radius:8px;">Sign in</a>
    <p style="margin-top:24px;font-size:12px;color:#5C6580;">If you didn't request this, you can safely ignore this email.</p>
  </div>
</div>
