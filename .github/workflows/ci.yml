name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      # 04-security.md: "CI grep gate: fail the build if any NEXT_PUBLIC_*
      # value matches a service-key pattern, or if
      # SUPABASE_SERVICE_ROLE_KEY appears in a file under app/** marked
      # 'use client'." A leaked service-role key is total database
      # compromise (bypasses RLS entirely) -- this step is the one that
      # actually blocks the merge, not just reports.
      - name: Service-key leak gate
        run: |
          set -euo pipefail
          fail=0

          # A JWT-shaped value assigned to a NEXT_PUBLIC_ var, anywhere in
          # tracked source -- the anon key is fine and expected; a
          # service-role key mistakenly exposed as NEXT_PUBLIC_ looks the
          # same shape and this can't tell them apart without decoding, so
          # any match here needs a human look either way.
          if grep -rnE "NEXT_PUBLIC_[A-Z_]*=.*eyJ[A-Za-z0-9_-]{10,}\.eyJ" \
               --include='*.ts' --include='*.tsx' --include='*.js' --include='*.env*' \
               --exclude-dir=node_modules --exclude-dir=.next .; then
            echo "::error::A JWT-shaped value is assigned to a NEXT_PUBLIC_* variable in source. Verify it is the anon key, not the service-role key."
            fail=1
          fi

          # SUPABASE_SERVICE_ROLE_KEY must only ever be read in
          # lib/supabase/admin.ts (server-only). Its literal name showing
          # up in any 'use client' file means it was about to ship to the
          # browser.
          for f in $(grep -rl "'use client'" src/app 2>/dev/null || true); do
            if grep -q "SUPABASE_SERVICE_ROLE_KEY" "$f"; then
              echo "::error file=$f::SUPABASE_SERVICE_ROLE_KEY referenced in a 'use client' file"
              fail=1
            fi
          done

          exit $fail

      - name: Run type check
        run: npm run type-check

      - name: Run ESLint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test -- --run
        continue-on-error: true

      # 05-testing.md CI gate order: "typecheck -> lint -> vitest -> supabase
      # db lint -> pgTAP -> build -> playwright. Any red blocks merge." Runs
      # only against the local Supabase stack this job starts itself -- never
      # the linked remote project, which has real customer data in it.
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Supabase db lint
        run: supabase db lint

      - name: pgTAP RLS suite
        run: npm run test:rls

      - name: Stop local Supabase
        if: always()
        run: supabase stop

      # 04-security.md: "Dependabot + npm audit in CI." Reporting, not
      # blocking -- gating hard on every transitive advisory would make CI
      # red on dependency churn this project doesn't control, independent
      # of any change in a given PR.
      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      # 04-security.md: "CI fails on Supabase advisor lints ... ." Needs
      # SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF repo secrets, which
      # aren't set yet (see .github/Spec Sheets/07-getting-started.md,
      # "Manual steps outside Claude Code") -- skips itself rather than
      # failing every run until they're added. Once they exist, drop the
      # `if:` guard and this becomes the real blocking gate the spec asks for.
      - name: Supabase advisor lints
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          for type in security performance; do
            curl -sf "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/advisors/$type" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | tee "advisors-$type.json"
            if grep -q '"level":"ERROR"' "advisors-$type.json"; then
              echo "::error::Supabase $type advisor reported an ERROR-level lint"
              exit 1
            fi
          done

  playwright:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Run E2E tests
        run: npm run e2e
        continue-on-error: true
