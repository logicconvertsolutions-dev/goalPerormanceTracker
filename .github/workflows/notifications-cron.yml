name: Notifications cron

# Vercel Hobby plan only allows once-a-day cron schedules, but the
# notifications route (src/app/api/cron/notifications/route.ts) needs a
# 15-minute cadence to catch each agent's local-time send window across
# arbitrary time zones (src/lib/notifications/window.ts). GitHub Actions has
# no such restriction, so it's the scheduler instead of vercel.json's cron.
#
# GitHub throttles scheduled workflow start times under load, so this is a
# best-effort 15-minute cadence, not a guarantee -- the same tolerance the
# window-matching logic already assumes.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    # CRON_TARGET_URL/CRON_SECRET aren't set until the app is actually
    # deployed somewhere (Vercel preview or production -- a custom domain
    # isn't required, any *.vercel.app URL works). The step below skips
    # cleanly instead of failing every 15 minutes until then, same as CI's
    # own Supabase advisor step does for its not-yet-configured secrets.
    #
    # BUG FIXED HERE: env used to be declared on the step itself, with the
    # step's own `if:` reading `env.CRON_TARGET_URL` -- but a step's own
    # `env:` isn't in scope yet when that same step's `if:` is evaluated, so
    # the condition always saw an empty value and the step was skipped on
    # every single run, regardless of whether the secret was actually
    # configured (confirmed via Actions run history: every prior run shows
    # this step's conclusion as "skipped", never "success"/"failure"). A
    # bare `secrets.CRON_TARGET_URL` in `if:` isn't valid either -- GitHub
    # rejects the `secrets` context there outright ("Unrecognized
    # named-value: 'secrets'"). Declaring the env at job level instead makes
    # it visible to the step's `if:` via the `env` context, which *is*
    # available there.
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      CRON_TARGET_URL: ${{ secrets.CRON_TARGET_URL }}
    steps:
      - name: Call the notifications cron route
        if: ${{ env.CRON_TARGET_URL != '' }}
        run: |
          curl --fail --silent --show-error \
            --max-time 30 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${CRON_TARGET_URL}"
